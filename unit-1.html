<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit 1 | Danica Blackman</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f3ed;
      color: #292522;
      font-family: Georgia, 'Times New Roman', serif;
      line-height: 1.7;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #d8cec2;
      background: #fffdf9;
    }
    nav a { color: #292522; text-decoration: none; font-size: 1rem; }
    nav a:hover, nav a:focus { text-decoration: underline; }
    main { width: min(900px, calc(100% - 3rem)); margin: 0 auto; padding: 5rem 0; }
    header { margin-bottom: 3rem; }
    h1 { margin: 0; font-size: clamp(2.2rem, 6vw, 4rem); font-weight: normal; line-height: 1.1; }
    .subtitle { margin: 1rem 0 0; color: #766b62; font-size: 1.25rem; font-style: italic; }
    section { margin-top: 3rem; }
    h2 { margin-bottom: 1.5rem; font-size: clamp(1.6rem, 3vw, 2.4rem); font-weight: normal; }
    .image-gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.25rem;
      margin: 2rem 0 2.5rem;
    }
    .image-gallery button {
      display: block;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: zoom-in;
    }
    .image-gallery img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 4px;
      box-shadow: 0 4px 14px rgba(41, 37, 34, 0.14);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }
    .image-gallery button:hover img,
    .image-gallery button:focus img {
      transform: scale(1.02);
      box-shadow: 0 7px 20px rgba(41, 37, 34, 0.22);
    }
    p { margin: 1.5rem 0; min-height: 2.5rem; }
    dialog {
      width: min(92vw, 1100px);
      max-width: none;
      padding: 3rem 1rem 1rem;
      border: 0;
      border-radius: 4px;
      background: #fffdf9;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    dialog::backdrop { background: rgba(41, 37, 34, 0.78); }
    dialog img { display: block; width: 100%; height: auto; max-height: 80vh; object-fit: contain; }
    .close-dialog {
      position: absolute;
      top: 0.5rem;
      right: 0.75rem;
      border: 0;
      background: transparent;
      color: #292522;
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
    }
    @media (max-width: 600px) {
      .image-gallery { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="unit-1.html" aria-current="page">Unit 1</a>
  </nav>
  <main>
    <header>
      <h1>Unit 1 Lens-Based Analysis Essay</h1>
      <p class="subtitle">Writing Process Archive</p>
    </header>

    <section>
      <h2>Blog: The Pressure Freshman Feel and A Sense of Belonging</h2>
      <div class="image-gallery" aria-label="Unit 1 images">
        <button type="button" data-image="IMG_1821.jpg" aria-label="Enlarge IMG_1821.jpg">
          <img src="IMG_1821.jpg" alt="Unit 1 image 1">
        </button>
        <button type="button" data-image="IMG_1822.jpg" aria-label="Enlarge IMG_1822.jpg">
          <img src="IMG_1822.jpg" alt="Unit 1 image 2">
        </button>
      </div>
      <p></p>
      <p></p>
      <p></p>
    </section>
  </main>

  <dialog id="image-dialog" aria-label="Enlarged image">
    <button class="close-dialog" type="button" aria-label="Close enlarged image">&times;</button>
    <img id="enlarged-image" src="" alt="">
  </dialog>

  <script>
    const dialog = document.querySelector('#image-dialog');
    const enlargedImage = document.querySelector('#enlarged-image');

    document.querySelectorAll('[data-image]').forEach((button) => {
      button.addEventListener('click', () => {
        enlargedImage.src = button.dataset.image;
        enlargedImage.alt = button.querySelector('img').alt;
        dialog.showModal();
      });
    });

    document.querySelector('.close-dialog').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', (event) => {
      if (event.target === dialog) dialog.close();
    });
  </script>
</body>
</html>
